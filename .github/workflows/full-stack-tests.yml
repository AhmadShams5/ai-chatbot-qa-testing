name: Full Stack AI Chatbot Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and dependencies
        run: npm install -D @playwright/test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server in background
        run: nohup ollama serve > ollama.log 2>&1 &

      - name: Wait for Ollama to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434 > /dev/null; then
              echo "Ollama is ready!"
              break
            fi
            echo "Waiting for Ollama..."
            sleep 2
          done

      - name: Pull Llama3.2 model
        run: ollama pull llama3.2

      - name: Install chatbot dependencies
        run: cd chatbot-app && npm install

      - name: Start chatbot server in background
        run: cd chatbot-app && nohup node server.js > server.log 2>&1 &

      - name: Wait for chatbot server to start
        run: sleep 5

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Install PromptFoo
        run: npm install -g promptfoo

      - name: Run PromptFoo tests
        run: promptfoo eval -c promptfoo-tests/chatbot-quality.yaml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: playwright-report/