name: Full Stack AI Chatbot Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: ollama serve &

      - name: Wait for Ollama to start
        run: sleep 5

      - name: Pull Llama3.2 model
        run: ollama pull llama3.2

      - name: Install chatbot dependencies
        run: cd chatbot-app && npm install

      - name: Start chatbot server
        run: cd chatbot-app && node server.js &

      - name: Wait for server to start
        run: sleep 5

      - name: Install Playwright
        run: npm install -D @playwright/test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Install PromptFoo
        run: npm install -g promptfoo

      - name: Run PromptFoo tests
        run: promptfoo eval -c promptfoo-tests/chatbot-quality.yaml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: playwright-report/