name: Full Stack AI Chatbot Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Install Playwright package explicitly
        run: npm install --save-dev @playwright/test@latest

      - name: Install Playwright browsers with deps
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server in background
        run: nohup ollama serve > ollama.log 2>&1 &

      - name: Wait for Ollama to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434 > /dev/null; then
              echo "Ollama is ready!"
              break
            fi
            sleep 2
          done

      - name: Pull Llama3.2 model
        run: |
          ollama pull llama3.2
          echo "=== Ollama models list ==="
          ollama list

      - name: Install chatbot dependencies
        run: |
          cd chatbot-app
          echo "=== package.json contents ==="
          cat package.json
          rm -rf node_modules package-lock.json
          npm install
          echo "=== Verify express installed ==="
          ls node_modules | grep express || echo "EXPRESS NOT FOUND!"

      - name: Start chatbot server in background
        run: cd chatbot-app && nohup node server.js > server.log 2>&1 &

      - name: Wait for chatbot server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Chatbot server is ready!"
              cat chatbot-app/server.log
              exit 0
            fi
            echo "Waiting for chatbot server... attempt $i"
            sleep 2
          done
          echo "=== SERVER NEVER STARTED - LOG OUTPUT ==="
          cat chatbot-app/server.log
          echo "=== Checking if node process is running ==="
          ps aux | grep node
          exit 1

      - name: Run Playwright tests
        run: node node_modules/@playwright/test/cli.js test --project=chromium

      - name: Install PromptFoo
        run: npm install -g promptfoo

      - name: Run PromptFoo tests
        run: promptfoo eval -c promptfoo-tests/chatbot-quality.yaml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: playwright-report/